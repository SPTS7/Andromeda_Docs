<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andromeda Server Control Center</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap');

        body {
            background-color: #060608;
            font-family: 'Inter', sans-serif;
            color: #e1e1e6;
            overflow-x: hidden;
        }

        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }

        .font-mono {
            font-family: 'Fira Code', monospace;
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: rgba(15, 15, 20, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glass-card-hover {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card-hover:hover {
            transform: translateY(-2px);
            background: rgba(22, 22, 28, 0.85);
            border-color: rgba(139, 92, 246, 0.3);
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.12);
        }

        /* SVG Node Hover Scaling */
        .svg-node {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform-box: fill-box;
            transform-origin: center;
        }

        .svg-node:hover {
            transform: scale(1.02);
            filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.3));
        }

        /* Sleek scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>
    <div id="app" class="flex flex-col lg:flex-row min-h-screen w-full">
        <!-- Dashboard components injected by modular ES6 app.js -->
        <div class="p-8 text-gray-500 font-mono text-xs animate-pulse">Initializing Andromeda Modular Dashboard...</div>
    </div>

    <!-- Modular Application Engine -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
